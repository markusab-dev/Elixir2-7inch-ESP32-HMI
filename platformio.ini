[platformio]
default_envs = waveshare_16mb
src_dir = src
include_dir = include

; Pinned toolchain and libraries for a reproducible first hardware bring-up.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
lib_ldf_mode = deep+
build_unflags =
  -std=gnu++11
  -DARDUINO_USB_MODE=1
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -I include
  -I src
lib_deps =
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
  https://github.com/lvgl/lvgl.git#v8.4.0

[env:waveshare_16mb]
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

[env:waveshare_8mb]
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
